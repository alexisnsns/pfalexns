name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *' # Every 3 days at 12:00 UTC (well under Supabase's 7-day pause window)
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Pinging a dedicated "keepalive" table (delete+insert) stopped
          # resetting Supabase's 7-day pause timer - the project paused despite
          # every ping succeeding. Query the real "posts" table instead, the
          # same request the site itself makes on page load, so this reads as
          # genuine app traffic rather than a synthetic keepalive pattern.
          echo "Querying posts table..."
          curl -X GET \
            "${SUPABASE_URL}/rest/v1/posts?select=id&order=created_at.desc&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --fail --silent --show-error -w "GET HTTP Status: %{http_code}\n"

